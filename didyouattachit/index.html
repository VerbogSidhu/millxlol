<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>did you attach it</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(45deg, #ff00ff, #00ffff, #ffff00, #ff0000);
      background-size: 400% 400%;
      animation: gradient 0.5s ease infinite;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Comic Neue', cursive, sans-serif;
      overflow: hidden;
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><text y="28" font-size="28">📎</text></svg>'), auto;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .main-text {
      font-size: 4rem;
      color: white;
      text-shadow: 
        3px 3px 0 #000,
        -3px -3px 0 #000,
        3px -3px 0 #000,
        -3px 3px 0 #000,
        0 0 30px #ff00ff;
      animation: shake 0.1s infinite;
      text-align: center;
      z-index: 10;
    }

    @keyframes shake {
      0%, 100% { transform: translate(0); }
      25% { transform: translate(-5px, 5px); }
      50% { transform: translate(5px, -5px); }
      75% { transform: translate(-5px, -5px); }
    }

    .attach-btn {
      margin-top: 50px;
      padding: 20px 40px;
      font-size: 2rem;
      font-family: 'Comic Neue', cursive;
      background: #ff0000;
      color: #ffff00;
      border: 5px dashed #00ff00;
      border-radius: 0;
      cursor: pointer;
      animation: rainbow-border 1s linear infinite;
      text-shadow: 2px 2px 0 #000;
      z-index: 10;
      transition: transform 0.1s;
    }

    .attach-btn:hover {
      animation: spin 0.2s linear infinite;
      transform: scale(1.5);
    }

    .attach-btn:active {
      background: #00ff00;
    }

    @keyframes rainbow-border {
      0% { border-color: #ff0000; }
      16% { border-color: #ff8800; }
      33% { border-color: #ffff00; }
      50% { border-color: #00ff00; }
      66% { border-color: #0088ff; }
      83% { border-color: #8800ff; }
      100% { border-color: #ff0000; }
    }

    @keyframes spin {
      from { transform: rotate(0deg) scale(1.5); }
      to { transform: rotate(360deg) scale(1.5); }
    }

    .paperclip {
      position: fixed;
      font-size: 3rem;
      animation: float 2s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(180deg); }
    }

    .status {
      position: fixed;
      bottom: 20px;
      font-size: 1.5rem;
      color: #000;
      background: #ffff00;
      padding: 10px 20px;
      border: 3px solid #000;
      animation: blink 0.3s infinite;
      z-index: 100;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .did-you {
      font-size: 1.5rem;
      color: #ff00ff;
      margin-top: 20px;
      text-shadow: 1px 1px 0 #000;
      animation: rainbow-text 0.5s linear infinite;
      z-index: 10;
    }

    @keyframes rainbow-text {
      0% { color: #ff0000; }
      16% { color: #ff8800; }
      33% { color: #ffff00; }
      50% { color: #00ff00; }
      66% { color: #0088ff; }
      83% { color: #8800ff; }
      100% { color: #ff0000; }
    }

    .epic-text {
      position: fixed;
      font-size: 2rem;
      color: white;
      text-shadow: 2px 2px 0 #000;
      animation: epic 2s ease-in-out infinite;
      z-index: 5;
    }

    @keyframes epic {
      0%, 100% { transform: scale(1) rotate(-5deg); }
      50% { transform: scale(1.2) rotate(5deg); }
    }

    .click-counter {
      position: fixed;
      top: 20px;
      right: 20px;
      font-size: 1.5rem;
      color: #000;
      background: #00ff00;
      padding: 10px;
      border: 3px solid #000;
      z-index: 100;
    }

    .consequences {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3rem;
      color: red;
      text-shadow: 0 0 20px red;
      opacity: 0;
      z-index: 1000;
      pointer-events: none;
    }

    .consequences.show {
      animation: consequences 2s forwards;
    }

    @keyframes consequences {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(2); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(3); }
    }

    .vincent {
      position: fixed;
      bottom: 100px;
      left: 20px;
      font-size: 1rem;
      color: #000;
      background: #fff;
      padding: 5px 10px;
      border: 2px solid #000;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div class="main-text">DID YOU ATTACH IT??? 📎</div>
  <div class="did-you">seriously... did you?</div>
  <button class="attach-btn" onclick="attach()">📎 CLICK TO ATTACH 📎</button>
  
  <div class="click-counter">times asked: <span id="count">0</span></div>
  <div class="status">⚠️ ATTACHMENT STATUS: UNKNOWN ⚠️</div>
  <div class="consequences" id="consequences">THE FILE WAS TOO POWERFUL</div>
  <div class="vincent">vincent says: no.</div>

  <!-- random paperclips -->
  <div class="paperclip" style="top: 10%; left: 10%;">📎</div>
  <div class="paperclip" style="top: 20%; left: 80%; animation-delay: 0.5s;">📎</div>
  <div class="paperclip" style="top: 60%; left: 20%; animation-delay: 1s;">📎</div>
  <div class="paperclip" style="top: 80%; left: 70%; animation-delay: 1.5s;">📎</div>
  <div class="paperclip" style="top: 40%; left: 50%; animation-delay: 0.3s;">📎</div>

  <!-- random epic texts -->
  <div class="epic-text" style="top: 15%; left: 5%;">WHERE IS IT</div>
  <div class="epic-text" style="top: 30%; right: 5%; animation-delay: 0.5s;">I NEED IT</div>
  <div class="epic-text" style="bottom: 15%; left: 15%; animation-delay: 1s;">THE ATTACHMENT</div>
  <div class="epic-text" style="bottom: 30%; right: 15%; animation-delay: 1.5s;">GIVE IT TO ME</div>

  <script>
    let count = 0;
    const responses = [
      "I DONT BELIEVE YOU",
      "PROVE IT",
      "LIES",
      "WHERE??",
      "I DONT SEE IT",
      "TRY HARDER",
      "THAT WASN'T IT",
      "INCORRECT",
      "FAIL",
      "NOPE",
      "NOT GOOD ENOUGH",
      "TRY AGAIN",
      "ARE YOU SURE??",
      "I'M WATCHING YOU",
      "THE FILE WEEPS",
      "ERROR 404: ATTACHMENT NOT FOUND",
      "vincent is disappointed",
      "the paperclips are judging you",
      "even the gradient is angry"
    ];

    function attach() {
      count++;
      document.getElementById('count').textContent = count;
      
      const btn = document.querySelector('.attach-btn');
      const status = document.querySelector('.status');
      
      // Random button behavior
      if (Math.random() > 0.5) {
        btn.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
      }
      
      // Random status message
      const messages = [
        "⚠️ ATTACHMENT STATUS: MISSING ⚠️",
        "⚠️ ATTACHMENT STATUS: LIAR ⚠️",
        "⚠️ ATTACHMENT STATUS: WRONG ⚠️",
        "⚠️ ATTACHMENT STATUS: UNACCEPTABLE ⚠️",
        "⚠️ ATTACHMENT STATUS: PAPERCLIP SHORTAGE ⚠️",
        "⚠️ ATTACHMENT STATUS: VINCENT SAYS NO ⚠️",
        "⚠️ ATTACHMENT STATUS: FILE NOT FOUND ⚠️",
        "⚠️ ATTACHMENT STATUS: ERROR ⚠️"
      ];
      status.textContent = messages[Math.floor(Math.random() * messages.length)];
      
      // Show consequences at certain counts
      if (count === 5 || count === 10 || count === 15) {
        const consequences = document.getElementById('consequences');
        consequences.className = 'consequences show';
        setTimeout(() => {
          consequences.className = 'consequences';
        }, 2000);
      }
      
      // Random screen shake at high counts
      if (count > 10) {
        document.body.style.animation = 'none';
        document.body.offsetHeight; // trigger reflow
        document.body.style.animation = `gradient 0.${Math.max(1, 5 - Math.floor(count/5))}s ease infinite`;
      }
      
      // Confetti at 20
      if (count === 20) {
        for (let i = 0; i < 50; i++) {
          setTimeout(() => {
            const confetti = document.createElement('div');
            confetti.textContent = '📎';
            confetti.style.cssText = `
              position: fixed;
              top: -50px;
              left: ${Math.random() * 100}%;
              font-size: ${Math.random() * 2 + 1}rem;
              animation: fall ${Math.random() * 3 + 2}s linear forwards;
              z-index: 9999;
            `;
            document.body.appendChild(confetti);
            setTimeout(() => confetti.remove(), 5000);
          }, i * 50);
        }
      }
      
      // Add a fall animation dynamically
      if (!document.getElementById('fall-style')) {
        const style = document.createElement('style');
        style.id = 'fall-style';
        style.textContent = `
          @keyframes fall {
            to {
              transform: translateY(110vh) rotate(720deg);
              opacity: 0;
            }
          }
        `;
        document.head.appendChild(style);
      }
    }

    // Random background color flash
    setInterval(() => {
      if (Math.random() > 0.9) {
        document.body.style.filter = `hue-rotate(${Math.random() * 360}deg)`;
        setTimeout(() => {
          document.body.style.filter = '';
        }, 100);
      }
    }, 500);
  </script>
</body>
</html>
