<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>millx@terminal</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      padding: 20px;
    }
    
    .terminal {
      width: 100%;
      max-width: 800px;
      background: #1a1a1a;
      border-radius: 10px;
      box-shadow: 0 0 0 1px #333, 0 20px 60px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    
    .header {
      background: #2d2d2d;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #444;
    }
    
    .btn { width: 12px; height: 12px; border-radius: 50%; border: none; }
    .btn.r { background: #ff5f56; }
    .btn.y { background: #ffbd2e; }
    .btn.g { background: #27c93f; }
    
    .title { flex: 1; text-align: center; color: #888; font-size: 13px; }
    
    .body {
      padding: 20px;
      height: 500px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.5;
    }
    
    .line { margin-bottom: 4px; white-space: pre-wrap; }
    .green { color: #00ff88; }
    .blue { color: #00bfff; }
    .red { color: #ff5f56; }
    .yellow { color: #ffbd2e; }
    .pink { color: #ff00ff; }
    .white { color: #fff; font-weight: bold; }
    .gray { color: #666; }
    
    input {
      background: none;
      border: none;
      color: #fff;
      font-family: inherit;
      font-size: inherit;
      outline: none;
      width: 100%;
      caret-color: #00ff88;
    }
  </style>
</head>
<body>
  <div class="terminal">
    <div class="header">
      <div class="btn r"></div>
      <div class="btn y"></div>
      <div class="btn g"></div>
      <div class="title">millx@terminal ~ zsh</div>
    </div>
    <div class="body" id="term"></div>
  </div>

  <script>
    var T = document.getElementById('term');
    var lines = [];
    var history = [];
    var histIdx = -1;

    function print(text, cls) {
      var d = document.createElement('div');
      d.className = 'line ' + (cls || 'green');
      d.textContent = text;
      T.appendChild(d);
    }

    function scrollToBottom() {
      T.scrollTop = T.scrollHeight;
    }

    var ASCII = [
      '▗▖  ▗▖▗▄▄▄▖▗▖   ▗▖   ▗▖  ▗▖',
      '▐▛▚▞▜▌  █  ▐▌   ▐▌    ▝▚▞▘ ',
      '▐▌  ▐▌  █  ▐▌   ▐▌     ▐▌  ',
      '▐▌  ▐▌▗▄█▄▖▐▙▄▄▖▐▙▄▄▖▗▞▘▝▚▖'
    ];

    var QUOTES = [
      '"HITLER WAS JUST MENTIONED" - Millx',
      '"Medium 40 minutes <-- dryer settings" - Millx',
      '"Legit Playcoins: 94" - Millx',
      '"My inner ayanokoji..." - Millx',
      '"fella, fella, fella" - Millx',
      '"i love yaemori" - Millx',
      '"~/reset_cx.sh" - Millx',
      '"nah bro is using const 💀" - Millx',
      '"Toradora is so fucking good" - Millx'
    ];

    function boot() {
      ASCII.forEach(function(l) { print(l, 'pink'); });
      print('Welcome to Millx\'s personal terminal v1.0.0', 'blue');
      print('Type "help" to see available commands.', 'green');
      print('Last login: Today from the internet', 'gray');
      print('', 'green');
      prompt();
    }

    function prompt() {
      var line = document.createElement('div');
      line.className = 'line green';
      
      var span = document.createElement('span');
      span.textContent = 'millx@terminal ~ % ';
      
      var inp = document.createElement('input');
      inp.type = 'text';
      inp.autofocus = true;
      inp.spellcheck = false;
      inp.autocomplete = 'off';
      
      inp.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          var cmd = inp.value.trim();
          inp.disabled = true;
          
          if (cmd) {
            history.push(cmd);
            histIdx = history.length;
          }
          
          run(cmd);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (histIdx > 0) {
            histIdx--;
            inp.value = history[histIdx];
          }
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (histIdx < history.length - 1) {
            histIdx++;
            inp.value = history[histIdx];
          } else {
            histIdx = history.length;
            inp.value = '';
          }
        }
      });
      
      line.appendChild(span);
      line.appendChild(inp);
      T.appendChild(line);
      scrollToBottom();
      inp.focus();
    }

    function run(cmd) {
      if (!cmd) {
        prompt();
        return;
      }
      
      var c = cmd.toLowerCase();
      
      if (c === 'help') {
        print('Available commands:', 'blue');
        print('─────────────────────────────────────', 'blue');
        print('  help      - Show this help message');
        print('  about     - Who is Millx?');
        print('  skills    - What can Millx do?');
        print('  games     - Favorite games');
        print('  anime     - Anime recommendations');
        print('  socials   - Social media links');
        print('  quote     - Random Millx quote');
        print('  music     - What Millx listens to');
        print('  os        - System information');
        print('  clear     - Clear terminal');
        print('  secret    - ???');
        print('─────────────────────────────────────', 'blue');
      }
      else if (c === 'about') {
        print('Fetching user data...', 'blue');
        print('┌─────────────────────────────────────┐', 'white');
        print('│  Name:        Millx                 │', 'white');
        print('│  Location:    The Internet          │', 'white');
        print('│  Status:      Online                │', 'white');
        print('│  Vibe:        Chill                 │', 'white');
        print('└─────────────────────────────────────┘', 'white');
        print('A guy who likes to play video games and watch anime.');
        print('Mostly into JRPGs and story-rich games.');
        print('Known for having questionable takes.', 'yellow');
      }
      else if (c === 'skills') {
        print('Loading skill tree...', 'blue');
        print('🎮 Gaming          ████████████████░░░░  85%');
        print('📺 Anime Watching  ████████████████████  100%');
        print('💬 Shitposting     ████████████████████  100%');
        print('🎵 Music Taste     ███████████████░░░░░  75%');
        print('💻 Coding          ████████░░░░░░░░░░░░  40%');
        print('😴 Sleeping        ████████████████░░░░  85%');
        print('📝 Homework        ████░░░░░░░░░░░░░░░░  20%', 'red');
        print('Status: Mostly gaming, avoiding responsibilities', 'yellow');
      }
      else if (c === 'games') {
        print('Loading game library...', 'blue');
        print('=== Favorite Games ===', 'pink');
        print('  ◆ Persona 5 Royal');
        print('  ◆ Final Fantasy VII Remake');
        print('  ◆ Xenoblade Chronicles');
        print('  ◆ Trails in the Sky');
        print('  ◆ Yakuza: Like a Dragon');
        print('  ◆ Undertale');
        print('  ◆ Deltarune');
        print('Currently playing: Something with a 100 hour campaign', 'blue');
      }
      else if (c === 'anime') {
        print('Loading anime list...', 'blue');
        print('=== Anime Recommendations ===', 'pink');
        print('  ★ Steins;Gate');
        print('  ★ Attack on Titan');
        print('  ★ Re:Zero');
        print('  ★ Oshi no Ko');
        print('  ★ Vinland Saga');
        print('  ★ Toradora!');
        print('  ★ Your Lie in April');
        print('Currently watching: Everything', 'blue');
      }
      else if (c === 'socials') {
        print('Connecting to social networks...', 'blue');
        print('┌─────────────────────────────────────┐', 'pink');
        print('│           SOCIAL LINKS              │', 'pink');
        print('├─────────────────────────────────────┤', 'pink');
        print('│  🎥 YouTube  → youtube.com/millx   │');
        print('│  🐦 Twitter  → x.com/millxismillx  │');
        print('│  🌐 Website  → millx.lol           │');
        print('└─────────────────────────────────────┘', 'pink');
        print('Just kidding, this is a terminal.', 'yellow');
      }
      else if (c === 'quote') {
        var q = QUOTES[Math.floor(Math.random() * QUOTES.length)];
        print('');
        print('  ' + q, 'pink');
        print('');
      }
      else if (c === 'music') {
        print('Loading music taste...', 'blue');
        print('=== Currently Vibing To ===', 'pink');
        print('  🎵 YOASOBI');
        print('  🎵 Kenshi Yonezu');
        print('  🎵 Eve');
        print('  🎵 Ado');
        print('  🎵 Persona OSTs');
        print('Currently playing: Something with "banger" in the title', 'blue');
      }
      else if (c === 'os') {
        print('millx-os v2.0.24 (linux/amd64)');
        print('System Information:', 'blue');
        print('  OS:         millx-lol edition');
        print('  Host:       The Internet');
        print('  Kernel:     anime-optimized');
        print('  Packages:   81 (quotes)');
        print('  Resolution: touch grass', 'red');
        print('  CPU:        Bean with feelings');
        print('  Memory:     Too many anime quotes', 'yellow');
      }
      else if (c === 'clear') {
        T.innerHTML = '';
      }
      else if (c === 'secret') {
        print('🔒 ACCESS GRANTED', 'pink');
        print('You found the secret command!', 'white');
        print("Millx's favorite color is green.");
        print('He thinks Yaemori is cute.');
        print("Don't tell anyone.", 'yellow');
      }
      else {
        print('zsh: command not found: ' + cmd, 'red');
      }
      
      prompt();
    }

    T.addEventListener('click', function() {
      var inp = T.querySelector('input:not([disabled])');
      if (inp) inp.focus();
    });

    boot();
  </script>
</body>
</html>
