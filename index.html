<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>millx.lol</title>
  <meta name="description" content="The personal website of Millx." />
  <meta property="og:title" content="millx.lol" />
  <meta property="og:description" content="The personal website of Millx." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://millx.lol" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="millx.lol" />
  <meta name="twitter:description" content="The personal website of Millx." />
  <link rel="icon" href="assets/ratwitharat.jpg" type="image/jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@300;400;500;600;700&family=Spectral:ital,wght@0,300;0,400;1,400&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="screen">

    <section class="card">

      <!-- left: you -->
      <div class="me">
        <img
          class="me__avatar"
          src="assets/russiandoggo.png"
          alt="Millx"
          width="225"
          height="225"
        />
        <h1 class="me__name">Hey, I&rsquo;m <em>Millx</em>!</h1>
        <p class="me__bio">
          I&rsquo;m a guy who likes to play video-games and watch anime.<br />
          I mostly play JRPG&rsquo;s and story rich games.
        </p>
      </div>

      <!-- right: poppy socials -->
      <nav class="socials" aria-label="Socials">
        <a class="soc soc--yt" href="https://youtube.com/millx" target="_blank" rel="noopener noreferrer">
          <span class="soc__disc" aria-hidden="true">
            <svg viewBox="0 0 90 90" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M85.7 25.4a11.2 11.2 0 0 0-7.9-7.9C70.9 15.4 45 15.4 45 15.4s-25.9 0-32.8 2.1a11.2 11.2 0 0 0-7.9 7.9C2.2 32.3 2.2 45 2.2 45s0 12.7 2.1 19.6a11.2 11.2 0 0 0 7.9 7.9c6.9 2.1 32.8 2.1 32.8 2.1s25.9 0 32.8-2.1a11.2 11.2 0 0 0 7.9-7.9C87.8 57.7 87.8 45 87.8 45s0-12.7-2.1-19.6Z" fill="#FF0000"/>
              <path d="m36 57 21.5-12L36 33v24Z" fill="#fff"/>
            </svg>
          </span>
          <span class="soc__body">
            <span class="soc__name">YouTube</span>
            <span class="soc__url">youtube.com/millx</span>
          </span>
          <span class="soc__arrow" aria-hidden="true">&nearr;</span>
        </a>
        <a class="soc soc--tw" href="https://x.com/millxismillx" target="_blank" rel="noopener noreferrer">
          <span class="soc__disc soc__disc--tw" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" xmlns="http://www.w3.org/2000/svg">
              <path d="M23.643 4.937c-.835.37-1.732.62-2.675.733.964-.578 1.705-1.49 2.051-2.577-.9.534-1.897.922-2.958 1.13-.85-.904-2.06-1.47-3.4-1.47-2.572 0-4.658 2.086-4.658 4.66 0 .364.042.718.12 1.06-3.873-.195-7.304-2.05-9.602-4.868-.4.69-.63 1.49-.63 2.34 0 1.612.82 3.036 2.07 3.864-.764-.025-1.482-.234-2.11-.583v.06c0 2.257 1.605 4.14 3.737 4.567-.391.106-.803.162-1.227.162-.3 0-.593-.028-.877-.082.593 1.85 2.32 3.194 4.36 3.232-1.6 1.252-3.616 1.996-5.815 1.996-.38 0-.75-.022-1.12-.064 2.06 1.32 4.51 2.09 7.14 2.09 8.57 0 13.255-7.098 13.255-13.255 0-.2-.005-.4-.014-.6.91-.658 1.7-1.477 2.323-2.41z" fill="#1DA1F2"/>
            </svg>
          </span>
          <span class="soc__body">
            <span class="soc__name">Twitter</span>
            <span class="soc__url">x.com/millxismillx</span>
          </span>
          <span class="soc__arrow" aria-hidden="true">&nearr;</span>
        </a>
      </nav>

    </section>

    <!-- slim quote ticker; sits at the bottom of the screen -->
    <footer class="ticker" id="ticker">
      <div class="ticker__roll" id="quote-roll">
        <blockquote class="ticker__quote" id="quote-text">
          <span class="ticker__q">&ldquo;</span><span id="quote-text-inner">deaf means you cant see idioy</span><span class="ticker__q">&rdquo;</span>
          <span class="ticker__by" id="quote-by">&mdash; RatWithAFace</span>
        </blockquote>
      </div>
      <span class="ticker__counter" id="quote-counter">01/70</span>
    </footer>

  </main>

  <!-- the background, after the ten seconds of normalcy run out -->
  <video
    class="bgvideo"
    id="bgvideo"
    autoplay
    muted
    playsinline
    preload="none"
    aria-hidden="true"
  >
    <source src="assets/yaemoricrying.mp4" type="video/mp4" />
  </video>
  <img
    class="bggif"
    id="bggif"
    src="assets/yaemori-loop.gif"
    alt=""
    aria-hidden="true"
  />

  <!-- RatWithAFace. he&rsquo;s around here somewhere. -->
  <button class="rat" id="rat" type="button" aria-label="RatWithAFace" title="RatWithAFace">
    <img class="rat__img" src="assets/ratwitharat.jpg" alt="RatWithAFace" width="88" height="117" loading="lazy" />
  </button>

  <script src="script.js"></script>
</body>
</html>
